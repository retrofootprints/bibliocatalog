<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <title>BiblioCatalog</title>
    <script>
      // GitHub Pages has no SPA rewrite rules (SPEC §13.2). The app itself only
      // uses hash routing, so this only matters for a stray non-hash deep link
      // or a bookmarked URL — redirect it back into the app as a hash route.
      var base = '/bibliocatalog/';
      var path = location.pathname.startsWith(base) ? location.pathname.slice(base.length) : '';
      location.replace(base + (location.hash || (path ? '#/' + path : '')) + location.search);
    </script>
  </head>
  <body></body>
</html>
